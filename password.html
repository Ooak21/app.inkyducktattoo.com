<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Choose a password | Inky Duck</title><link rel="stylesheet" href="./password.css"></head>
<body><main class="card"><a class="brand" href="./login.html">Inky Duck</a><p class="eyebrow">CUSTOMER CARE</p><h1>Make it yours.</h1><p id="intro">Choose a new password for your account. This replaces your previous or temporary password.</p>
<p id="status" role="status" aria-live="polite">Checking your access…</p>
<form id="password-form" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="password-help" required><p class="small" id="password-help">At least 12 characters. A unique passphrase works well.</p><label for="confirmation">Confirm new password</label><input id="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="save" type="submit">Save new password</button></form>
<p id="recovery" hidden><a href="./forgot-password.html">Request a new reset link</a></p><p><a id="back" href="./login.html">Back to sign in</a></p><noscript>Enable JavaScript to set your password.</noscript></main>
<script type="module" src="./password.js"></script></body></html>
