<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Sign in | Inky Duck</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#171717;font:16px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{background:#171717;color:white;padding:8vw;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh}.wordmark{font:700 38px/1 'Barlow Condensed',sans-serif;color:#e6b34d}.brand h1{font:600 clamp(48px,6vw,84px)/1 'Barlow Condensed',sans-serif;max-width:440px;margin:36px 0 20px}.brand p{color:#c2c4c7;max-width:360px}.sign-in{display:grid;place-items:center;padding:40px}form{width:100%;max-width:360px}h2{font:600 34px 'Barlow Condensed',sans-serif;margin:0 0 8px}label{display:block;margin:22px 0 7px;font-weight:600;font-size:14px}input{width:100%;padding:13px;border:1px solid #a8adb3;border-radius:5px;font:inherit;background:white}button{width:100%;margin-top:24px;border:0;border-radius:5px;background:#e6b34d;color:#171717;padding:14px;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:inherit}small,.muted{color:#62676d}#status{min-height:24px;color:#984128;font-size:14px}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #267358;outline-offset:3px}@media(max-width:720px){body{display:block}.brand{min-height:auto;padding:28px}.brand h1{font-size:40px;margin:24px 0 10px}.brand footer{display:none}.sign-in{padding:32px 24px}.brand p{margin:0}}
</style></head><body><section class="brand"><div class="wordmark">Inky Duck</div><div><h1>A little care.<br>A lasting connection.</h1><p>Your place to answer questions, follow up and look after Inky Duck customers.</p></div><footer>Inky Duck Tattoo • Team workspace</footer></section><main class="sign-in"><form id="login"><h2>Welcome back.</h2><p class="muted">Sign in to your Inky Duck workspace.</p><label for="email">Work email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign in</button><p id="status" role="status" aria-live="polite"></p><small>Need access? Ask your Inky Duck workspace administrator.</small><p><a href="https://inkyducktattoo.com/">Visit the store</a></p></form></main><script type="module">
import{db,membership}from './auth.js';
const form=document.querySelector('form'),status=document.getElementById('status'),button=document.getElementById('submit');
if(new URLSearchParams(location.search).has('access'))status.textContent='Sign in with an account that has Inky Duck access.';
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='Signing in…';try{const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw new Error('Email or password was not accepted. Please try again.');if(!await membership()){await db.auth.signOut();throw new Error('This account does not have Inky Duck access. Contact your workspace administrator.');}location.replace('./index.html');}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
