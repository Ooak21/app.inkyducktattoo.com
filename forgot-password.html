<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Reset password | Inky Duck</title><link rel="stylesheet" href="./password.css"></head>
<body><main class="card"><a class="brand" href="./login.html">Inky Duck</a><p class="eyebrow">CUSTOMER CARE</p><h1>Forgot your password?</h1><p>Enter your account email. We’ll send you a link to choose a new password.</p>
<form id="reset-form"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" maxlength="254" required><button id="send" type="submit">Send reset link</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="./login.html">Back to sign in</a></p><p class="small">Have a temporary password? <a href="./login.html?setup=1">Sign in and choose your own.</a></p>
<noscript>Enable JavaScript to request a reset link.</noscript></main>
<script type="module">
const form=document.getElementById('reset-form'),button=document.getElementById('send'),status=document.getElementById('status');
form.addEventListener('submit',async event=>{
 event.preventDefault();if(button.disabled)return;button.disabled=true;status.textContent='Requesting your reset link…';
 try {
  const response=await fetch('https://jtifhcvbgxqwlywugvjv.supabase.co/functions/v1/inky-duck-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()}),signal:AbortSignal.timeout(35000)});
  if(!response.ok){status.textContent=response.status===429?'Please wait a minute before requesting another link.':'We could not request the link. Please try again shortly.';button.disabled=false;return;}
  status.textContent='If an account exists for that email, a reset link is on its way. Check your inbox and spam folder. Use the newest link.';
  button.textContent='Link requested';
  setTimeout(()=>{button.disabled=false;button.textContent='Send another link';},60000);
 }catch{status.textContent='We could not connect. Check your connection and try again.';button.disabled=false;}
});
</script></body></html>
